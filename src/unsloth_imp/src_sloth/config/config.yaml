
### config/config.yaml
# Main configuration file for LLM Fine-tuning Pipeline

# Domain-specific configuration
domain_topic: "electric vehicle charging stations"
use_case: "qa"

# Environment settings
environment:
  name: "llm_pipeline"
  gpu_enabled: true
  mixed_precision: true
  distributed: false

# Data Collection Configuration
data_collection:
  web_sources:
    - "https://www.energy.gov/eere/electricvehicles"
    - "https://www.nrel.gov/transportation/electric-vehicle-charging-infrastructure.html"
  pdf_sources:
    - "data/raw/ev_charging_standards.pdf"
    - "data/raw/ev_infrastructure_report.pdf"
  output_dir: "data/raw"
  max_pages_per_source: 100
  scraping_delay: 1.0
  
# Data Processing Configuration
data_processing:
  cleaning:
    remove_html_tags: true
    normalize_whitespace: true
    min_text_length: 50
    language: "en"
  deduplication:
    method: "fuzzy"
    threshold: 0.85
  quality_filtering:
    min_quality_score: 0.7
    filters:
      - "language_detection"
      - "content_relevance"
      - "readability"
  chunking:
    max_chunk_size: 2048
    overlap: 64
    method: "sliding_window"
  output_dir: "data/processed"

# Synthetic Data Generation Configuration
synthetic_data:
  base_model: "unsloth/Llama-3.2-3B-Instruct"
  max_seq_length: 2048
  temperature: 0.7
  top_p: 0.95
  pairs_per_chunk: 25
  max_generation_tokens: 512
  output_dir: "data/synthetic"
  
# Fine-tuning Configuration
fine_tuning:
  base_model: "unsloth/Llama-3.2-3B-Instruct"
  max_seq_length: 2048
  load_in_4bit: true
  load_in_8bit: false
  full_finetuning: false
  
  # LoRA Configuration
  lora_r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  use_rslora: false
  
  # Training Parameters
  training_params:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    warmup_steps: 5
    max_steps: 100
    learning_rate: 2.0e-4
    logging_steps: 1
    optim: "adamw_8bit"
    weight_decay: 0.01
    lr_scheduler_type: "linear"
    seed: 3407
    gradient_checkpointing: "unsloth"
    
  output_path: "models/fine_tuned"
  save_method: "lora"  # Options: lora, merged_16bit, merged_4bit, gguf

# Evaluation Configuration
evaluation:
  baseline_model: "unsloth/Llama-3.2-3B-Instruct"
  benchmark_size: 100
  metrics:
    - "rouge"
    - "bleu"
    - "bert_score"
    - "domain_relevance"
  output_dir: "outputs/evaluations"
  
# Deployment Configuration
deployment:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  version_tag: "latest"
  authentication: true
  metrics_port: 9090
  model_registry_path: "models/registry"
  
  # API Configuration
  api:
    max_tokens: 512
    temperature: 0.1
    top_p: 0.9
    timeout: 30
    rate_limit: 100  # requests per minute
    
# Orchestration Configuration
orchestration:
  checkpoints_dir: "models/checkpoints"
  enable_resume: true
  save_intermediate: true
  cleanup_temp: true
  
# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pipeline.log"
  max_size: "10MB"
  backup_count: 5
  
# Monitoring Configuration
monitoring:
  enabled: true
  metrics_backend: "prometheus"
  alerts_enabled: true
  dashboard_port: 3000



